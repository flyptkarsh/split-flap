<!doctype html>
<!-- No ES modules, no customElements: works from file:// and in any WebView. -->

<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0c}</style>
<div id="mount"></div>
<script src="../dist/split-flap.global.js"></script>
<script>

    lines: ["HELLO FROM A WEBVIEW", "NO MODULES NEEDED"], size: 28, theme: "black", sound: true
  });
  window.board = board;
</script>
